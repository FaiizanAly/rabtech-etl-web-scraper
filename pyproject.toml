[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devscrape"
version = "0.1.0"
description = "Automated ETL web scraping pipeline with rate limiting, retries, BeautifulSoup parsing, and summary statistics reporting"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Faizan Ali", email = "git.faizanali@gmail.com" }
]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
